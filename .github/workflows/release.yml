name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert the tag matches KI-VERSION
        run: |
          version="$(tr -d '[:space:]' < src/KI-VERSION)"
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "release: tag ${{ github.ref_name }} does not match src/KI-VERSION $version" >&2
            exit 1
          fi
      - name: Build the release zip
        run: bash scripts/build.sh
      - name: Attach the zip as ki.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(tr -d '[:space:]' < src/KI-VERSION)"
          cp "dist/ki-$version.zip" dist/ki.zip
          gh release create "${{ github.ref_name }}" --generate-notes dist/ki.zip \
            || gh release upload "${{ github.ref_name }}" dist/ki.zip --clobber
